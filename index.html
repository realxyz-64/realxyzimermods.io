<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>realxyzimer — Быстрый поиск модов Nexus без рекламы</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <span class="brand">realxyzimer</span>
            <span class="badge">Powered by NexusMods</span>
        </div>
        <div class="features-tag">⚡ Без рекламы • Мгновенный поиск</div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Поиск модов без задержек и мусора</h1>
            <p>Укажите игру и ключевое слово, чтобы найти нужные модификации.</p>
            
            <form id="search-form" class="search-box">
                <input type="text" id="game-input" placeholder="Игра (например: skyrimspecialedition, fallout4, cyberpunk2077)" required>
                <input type="text" id="query-input" placeholder="Название мода или тег..." required>
                <button type="submit">Искать моды</button>
            </form>
        </section>

        <section id="results-section" class="results-container">
            <div id="loading" class="hidden">Поиск модов...</div>
            <div id="mod-grid" class="mod-grid"></div>
        </section>
    </main>

    <footer>
        <p>realxyzimer &copy; 2026. Контент предоставляется Nexus Mods API.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
